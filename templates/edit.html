<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Bill | AI Billing System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(79, 70, 229, 0.10), transparent 35%),
                #f5f7fb;
            color: #172033;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
        }

        .edit-card {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 24px;
            box-shadow:
                0 25px 70px rgba(15, 23, 42, 0.10),
                0 8px 25px rgba(37, 99, 235, 0.06);
            overflow: hidden;
        }

        /* Header */
        .card-header {
            position: relative;
            padding: 30px 34px;
            background:
                linear-gradient(135deg, #0f172a 0%, #1d4ed8 58%, #4f46e5 100%);
            color: white;
            overflow: hidden;
        }

        .card-header::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            right: -60px;
            top: -80px;
        }

        .card-header::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            right: 80px;
            bottom: -70px;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #93c5fd;
            box-shadow: 0 0 12px rgba(147, 197, 253, 0.8);
        }

        .card-header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .card-header p {
            margin: 8px 0 0;
            color: rgba(255,255,255,0.78);
            font-size: 14px;
        }

        /* Form */
        .form-section {
            padding: 34px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 15px;
            font-weight: 800;
            color: #334155;
        }

        .section-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 17px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.65;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            background: #f8fafc;
            color: #172033;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .has-icon input {
            padding-left: 43px;
        }

        input:hover {
            border-color: #bfdbfe;
            background: #ffffff;
        }

        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Action area */
        .action-area {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid #e8edf3;
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .update-btn {
            flex: 1;
            height: 52px;
            border-radius: 13px;
            color: white;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
            font-size: 14px;
        }

        .update-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.28);
        }

        .update-btn:active {
            transform: translateY(0);
        }

        .update-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            width: 130px;
            height: 52px;
            border-radius: 13px;
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #e2e8f0;
        }

        /* Footer */
        .security-note {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .security-note span {
            color: #2563eb;
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .page-wrapper {
                padding: 15px;
            }

            .edit-card {
                border-radius: 20px;
            }

            .card-header {
                padding: 25px 22px;
            }

            .card-header h1 {
                font-size: 25px;
            }

            .form-section {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .action-area {
                flex-direction: column;
            }

            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <div class="edit-card">

        <!-- Header -->
        <div class="card-header">
            <div class="header-content">

                <div class="brand">
                    <span class="brand-dot"></span>
                    ANFIA TECHNOLOGY
                </div>

                <h1>✏️ Edit Bill</h1>

                <p>Update invoice information securely and accurately.</p>

            </div>
        </div>

        <!-- Form -->
        <div class="form-section">

            <div class="section-title">
                <div class="section-icon">🧾</div>
                <span>Bill Information</span>
            </div>

            <form method="POST" id="editForm">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}">

                <!-- Customer -->
                <div class="form-group">
                    <label for="customerName">Customer Name</label>

                    <div class="input-wrapper has-icon">
                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="customerName"
                            name="customer_name"
                            value="{{ bill.customer_name }}"
                            placeholder="Customer Name"
                            required>
                    </div>
                </div>

                <!-- Mobile -->
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>

                    <div class="input-wrapper has-icon">
                        <span class="input-icon">📱</span>

                        <input
                            type="text"
                            id="mobile"
                            name="mobile"
                            value="{{ bill.mobile }}"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            inputmode="numeric"
                            placeholder="10 Digit Mobile Number"
                            required>
                    </div>
                </div>

                <!-- Product -->
                <div class="form-group">
                    <label for="product">Product</label>

                    <div class="input-wrapper has-icon">
                        <span class="input-icon">📦</span>

                        <input
                            type="text"
                            id="product"
                            name="product"
                            value="{{ bill.product }}"
                            placeholder="Product Name"
                            required>
                    </div>
                </div>

                <!-- Quantity + Price -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="quantity">Quantity</label>

                        <div class="input-wrapper has-icon">
                            <span class="input-icon">🔢</span>

                            <input
                                type="number"
                                id="quantity"
                                name="quantity"
                                value="{{ bill.quantity }}"
                                min="1"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="price">Price</label>

                        <div class="input-wrapper has-icon">
                            <span class="input-icon">₹</span>

                            <input
                                type="number"
                                id="price"
                                name="price"
                                value="{{ bill.price }}"
                                step="0.01"
                                min="0.01"
                                required>
                        </div>
                    </div>

                </div>

                <!-- Actions -->
                <div class="action-area">

                    <button
                        type="submit"
                        id="updateBtn"
                        class="update-btn">
                        💾 Update Bill
                    </button>

                    <a href="/history">
                        <button
                            type="button"
                            class="back-btn">
                            ← Back
                        </button>
                    </a>

                </div>

            </form>

            <div class="security-note">
                🔒 <span>Secure Billing</span> · Your invoice data is protected
            </div>

        </div>

    </div>

</div>

<script>
document.getElementById("editForm").addEventListener("submit", function () {
    const btn = document.getElementById("updateBtn");

    btn.disabled = true;
    btn.innerHTML = "⏳ Updating...";
});
</script>

</body>
</html>
