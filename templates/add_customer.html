<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Customer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
{% set active_page = 'customers' %}
{% include '_sidebar.html' %}

<main class="main">
  <header class="topbar">
    <h1>Add Customer</h1>
    <a class="btn btn-light" href="/customers">← Back</a>
  </header>

  <section class="content">
    <div class="card" style="padding:22px;max-width:720px">
      <form method="POST" action="/add_customer">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-grid">
          <div class="field">
            <label>Customer Name</label>
            <input type="text" name="name" required placeholder="Enter customer name">
          </div>
          <div class="field">
            <label>Mobile Number</label>
            <input type="text" name="mobile" required maxlength="10" placeholder="10 digit mobile">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="Optional">
          </div>
          <div class="field">
            <label>Address</label>
            <input type="text" name="address" placeholder="Optional">
          </div>
        </div>
        <button class="btn" type="submit" style="margin-top:18px">💾 Save Customer</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
