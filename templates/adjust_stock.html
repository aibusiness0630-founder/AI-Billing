<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjust Stock</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
{% set active_page = 'stock' %}
{% include '_sidebar.html' %}
<main class="main">
  <header class="topbar">
    <h1>Adjust Stock</h1>
    <a class="btn btn-light" href="/stock_history">← Back</a>
  </header>
  <section class="content">
    <div class="card" style="padding:20px;max-width:720px">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-grid">
          <div class="field">
            <label>Product</label>
            <select name="product_id" required>
              {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} (Stock: {{ p.stock }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label>Type</label>
            <select name="adjustment_type">
              <option value="ADD">Add (+)</option>
              <option value="REMOVE">Remove (−)</option>
            </select>
          </div>
          <div class="field">
            <label>Quantity</label>
            <input type="number" name="quantity" min="1" required>
          </div>
          <div class="field" style="grid-column:1/-1">
            <label>Notes</label>
            <input type="text" name="notes" placeholder="Reason (damaged, recount...)">
          </div>
        </div>
        <button class="btn" type="submit" style="margin-top:16px">Save Adjustment</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
