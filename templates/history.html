<!DOCTYPE html>
<html>

<head>

<title>Bill History</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


<style>

.table-box{
    overflow-x:auto;
}


table{

    width:100%;
    border-collapse:collapse;

}


th,td{

    border:1px solid #ddd;
    padding:10px;
    text-align:center;

}


th{

    background:#007bff;
    color:white;

}


button{

    padding:6px 10px;
    cursor:pointer;

}


</style>


</head>


<body>


<div class="container">


<h1>
📜 Bill History
</h1>



<div class="table-box">


<table>


<tr>

<th>ID</th>
<th>Customer</th>
<th>Mobile</th>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Action</th>


</tr>




{% for bill in bills %}



<tr>


<td>
{{ bill.id }}
</td>


<td>
{{ bill.customer_name }}
</td>


<td>
{{ bill.mobile }}
</td>


<td>
{{ bill.product }}
</td>


<td>
{{ bill.quantity }}
</td>


<td>
₹{{ "%.2f"|format(bill.price) }}
</td>


<td>
₹{{ "%.2f"|format(bill.total) }}
</td>



<td>


<a href="/edit/{{ bill.id }}">

<button>
✏️ Edit
</button>

</a>




<a href="/delete/{{ bill.id }}"
onclick="return confirm('Delete this bill?')">


<button>
🗑 Delete
</button>


</a>





<a href="/download_bill/{{ bill.id }}">


<button>

📄 PDF

</button>


</a>



</td>


</tr>




{% else %}


<tr>

<td colspan="8">

No Bills Available

</td>

</tr>



{% endfor %}



</table>


</div>



<br>


<a href="/">

<button>
⬅ Back to Billing
</button>

</a>



</div>


</body>

</html>
