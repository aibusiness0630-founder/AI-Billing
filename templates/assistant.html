<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  .ai-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
  .ai-card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(15,23,42,.06);overflow:hidden}
  .ai-head{padding:16px 18px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ai-head h2{margin:0;font-size:16px;color:#0f172a}
  #chat{height:380px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#f8fafc}
  .msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:#fff;border:1px solid #e2e8f0;color:#1e293b;border-bottom-left-radius:4px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid #eef2f7}
  .chip{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .chip:hover{background:#dbeafe}
  .composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eef2f7;align-items:center}
  .composer input[type=text]{flex:1;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}
  .mic{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;color:#fff;font-size:20px;background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 6px 16px rgba(37,99,235,.3)}
  .mic.on{background:linear-gradient(135deg,#dc2626,#f97316);animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}100%{box-shadow:0 0 0 14px rgba(220,38,38,0)}}
  .opts{display:flex;gap:12px;align-items:center;font-size:12px;color:#64748b;padding:0 16px 12px;flex-wrap:wrap}
  .opts select{padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px}
  #insights{padding:14px;display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto}
  .ins{border-radius:12px;padding:12px 14px;border-left:4px solid;font-size:13px}
  .ins .t{font-weight:700;color:#0f172a;margin-bottom:4px}
  .ins .d{color:#475569;line-height:1.5}
  .ins a{display:inline-block;margin-top:8px}
  .ins-danger{background:#fef2f2;border-color:#dc2626}
  .ins-warning{background:#fffbeb;border-color:#f59e0b}
  .ins-info{background:#eff6ff;border-color:#2563eb}
  .ins-success{background:#f0fdf4;border-color:#16a34a}
  @media(max-width:900px){.ai-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
{% set active_page = 'assistant' %}
{% include '_sidebar.html' %}

<main class="main">
  <header class="topbar">
    <h1>✦ AI Assistant</h1>
    <span class="badge badge-ok">Premium</span>
  </header>

  <section class="content">
    <div class="ai-grid">

      <div class="ai-card">
        <div class="ai-head"><h2>🎤 Kelunga, naan sollren</h2></div>

        <div id="chat">
          <div class="msg bot">Vanakkam! Mic-a click panni pesunga allathu type pannunga. Sales, stock, profit, supplier balance, top customer ellam kelunga.</div>
        </div>

        <div class="chips">
          {% for e in examples %}
          <button type="button" class="chip" data-q="{{ e }}">{{ e }}</button>
          {% endfor %}
        </div>

        <form class="composer" id="composer">
          <button type="button" class="mic" id="mic" title="Speak">🎤</button>
          <input type="text" id="msg" placeholder="Idhula type pannunga..." autocomplete="off" maxlength="300">
          <button type="submit" class="btn">Send</button>
        </form>

        <div class="opts">
          <label>Voice language:
            <select id="lang">
              <option value="en-IN">English / Tanglish</option>
              <option value="ta-IN">தமிழ்</option>
            </select>
          </label>
          <label><input type="checkbox" id="speakOn" checked> Pathil-a pesu</label>
          <span id="hint"></span>
        </div>
      </div>

      <div class="ai-card">
        <div class="ai-head">
          <h2>💡 Smart Insights</h2>
          <button type="button" class="btn btn-sm btn-light" id="refresh">↻ Refresh</button>
        </div>
        <div id="insights"></div>
      </div>

    </div>
  </section>
</main>

<script type="application/json" id="insights-data">{{ insights|tojson }}</script>

<script>
var INITIAL_INSIGHTS = JSON.parse(document.getElementById('insights-data').textContent);

var chat = document.getElementById('chat');
var input = document.getElementById('msg');
var micBtn = document.getElementById('mic');
var langSel = document.getElementById('lang');
var speakChk = document.getElementById('speakOn');
var hint = document.getElementById('hint');

function addMsg(text, who) {
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speak(text) {
  if (!speakChk.checked || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

async function send(text) {
  text = (text || '').trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  var typing = addMsg('...', 'bot');
  try {
    var res = await fetch('/api/assistant', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
      body: JSON.stringify({message: text})
    });
    var ct = res.headers.get('content-type') || '';
    if (!res.ok || ct.indexOf('json') === -1) {
      typing.textContent = 'Premium plan venum allathu session mudinjirukku. Thirumba login pannunga.';
      return;
    }
    var data = await res.json();
    typing.textContent = data.reply;
    speak(data.speak || data.reply);
  } catch (e) {
    typing.textContent = 'Server connect aagala. Thirumba try pannunga.';
  }
}

document.getElementById('composer').addEventListener('submit', function (e) {
  e.preventDefault();
  send(input.value);
});

document.querySelectorAll('.chip').forEach(function (c) {
  c.addEventListener('click', function () { send(c.getAttribute('data-q')); });
});

/* ---------- VOICE INPUT ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;

if (!SR) {
  micBtn.disabled = true;
  hint.textContent = 'Voice-ku Chrome allathu Edge use pannunga.';
} else {
  rec = new SR();
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = function (e) {
    var t = e.results[0][0].transcript;
    input.value = t;
    send(t);
  };
  rec.onend = function () { listening = false; micBtn.classList.remove('on'); };
  rec.onerror = function (e) {
    listening = false;
    micBtn.classList.remove('on');
    addMsg(e.error === 'not-allowed'
      ? 'Mic permission kudunga (address bar-la lock icon click pannunga).'
      : 'Voice puriyala (' + e.error + '). Thirumba try pannunga.', 'bot');
  };
  micBtn.addEventListener('click', function () {
    if (listening) { rec.stop(); return; }
    if (window.speechSynthesis) { window.speechSynthesis.cancel(); }
    rec.lang = langSel.value;
    try { rec.start(); listening = true; micBtn.classList.add('on'); } catch (err) {}
  });
}

/* ---------- INSIGHTS ---------- */
function renderInsights(list) {
  var box = document.getElementById('insights');
  box.innerHTML = '';
  list.forEach(function (i) {
    var d = document.createElement('div');
    d.className = 'ins ins-' + i.level;
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = i.icon + ' ' + i.title;
    var p = document.createElement('div');
    p.className = 'd';
    p.textContent = i.detail;
    d.appendChild(t);
    d.appendChild(p);
    if (i.url && i.url.charAt(0) === '/') {
      var a = document.createElement('a');
      a.className = 'btn btn-sm btn-light';
      a.href = i.url;
      a.textContent = i.link_text || 'Open';
      d.appendChild(a);
    }
    box.appendChild(d);
  });
}

renderInsights(INITIAL_INSIGHTS);

document.getElementById('refresh').addEventListener('click', async function () {
  try {
    var res = await fetch('/api/insights', {headers: {'X-Requested-With': 'XMLHttpRequest'}});
    var data = await res.json();
    renderInsights(data.insights);
  } catch (e) {}
});
</script>
</body>
</html>
