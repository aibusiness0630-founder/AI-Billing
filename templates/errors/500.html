<!DOCTYPE html>
<html>
<head>
    <title>Server Error | AI Billing</title>
    <style>
        body{
            font-family:'Inter',Arial,sans-serif;
            background:linear-gradient(135deg,#0b1220,#7f1d1d);
            height:100vh;
            margin:0;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            text-align:center;
        }
        .box{
            max-width:450px;
            padding:40px;
        }
        .code{
            font-size:100px;
            font-weight:800;
            line-height:1;
            background:linear-gradient(135deg,#fca5a5,#fecaca);
            background-clip:text;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        h1{
            font-size:22px;
            margin:15px 0 10px;
        }
        p{
            color:#d1a3a3;
            font-size:14px;
            margin-bottom:25px;
        }
        a{
            display:inline-block;
            padding:12px 25px;
            background:linear-gradient(135deg,#dc2626,#ef4444);
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:700;
            font-size:13px;
        }
        a:hover{
            opacity:0.9;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="code">500</div>
    <h1>Something Went Wrong</h1>
    <p>An unexpected error occurred. Please try again.</p>
    <a href="/">🏠 Back to Home</a>
</div>

</body>
</html>
