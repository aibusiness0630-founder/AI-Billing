<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin | ANFIA</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif;color:#e2e8f0;
    background:
      radial-gradient(circle at 15% 10%,rgba(37,99,235,.25),transparent 35%),
      radial-gradient(circle at 85% 90%,rgba(79,70,229,.22),transparent 35%),
      linear-gradient(145deg,#061a38,#0b2854 60%,#12366e);
  }
  .box{
    width:100%;max-width:410px;padding:32px 28px;border-radius:20px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);box-shadow:0 25px 60px rgba(0,0,0,.35);
  }
  .logo{
    width:54px;height:54px;border-radius:15px;margin-bottom:16px;display:flex;
    align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;
    background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 10px 25px rgba(37,99,235,.35);
  }
  h1{font-size:23px;color:#fff;letter-spacing:-.4px}
  .sub{margin:6px 0 22px;font-size:12px;color:#93c5fd;letter-spacing:1px;font-weight:700;text-transform:uppercase}
  label{display:block;margin:0 0 7px;font-size:12px;font-weight:700;color:#cbd5e1}
  input{
    width:100%;height:46px;padding:0 14px;margin-bottom:16px;border-radius:11px;outline:none;
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:14px;
  }
  input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.15)}
  button{
    width:100%;height:48px;border:0;border-radius:11px;cursor:pointer;color:#fff;font-weight:800;font-size:14px;
    background:linear-gradient(135deg,#0066cc,#4f46e5);box-shadow:0 10px 22px rgba(37,99,235,.3);
  }
  .err{margin-bottom:16px;padding:11px 13px;border-radius:10px;background:rgba(220,38,38,.15);border:1px solid rgba(248,113,113,.4);color:#fecaca;font-size:12.5px}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:#64748b}
</style>
</head>
<body>
<form class="box" method="POST" action="/superadmin/login" autocomplete="off">
  <div class="logo">AI</div>
  <h1>Super Admin</h1>
  <div class="sub">ANFIA Technology</div>

  {% if error %}<div class="err">⚠️ {{ error }}</div>{% endif %}

  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="username">Username</label>
  <input id="username" type="text" name="username" required autofocus autocomplete="username">

  <label for="password">Password</label>
  <input id="password" type="password" name="password" required autocomplete="current-password">

  <button type="submit">Sign In →</button>
  <div class="foot">Authorized access only</div>
</form>
</body>
</html>
