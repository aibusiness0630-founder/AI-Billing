<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Billing Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">

            <h1>AI Billing</h1>

            <p>Smart Billing Management System</p>

        </div>

        {% if error %}

        <div class="error-box">

            {{ error }}

        </div>

        {% endif %}

        <form method="POST">

            <label>Username</label>

            <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
            autofocus>

            <label>Password</label>

            <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            required>

            <div class="show-password">

                <input
                type="checkbox"
                onclick="togglePassword()">

                Show Password

            </div>

            <button type="submit">

                🔐 Login

            </button>

        </form>

        <div class="footer">

            © 2026 AI Billing System

        </div>

    </div>

</div>

<script>

function togglePassword(){

    let x=document.getElementById("password");

    if(x.type==="password"){

        x.type="text";

    }else{

        x.type="password";

    }

}

</script>

</body>

</html>
