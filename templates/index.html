<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Billing</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<style>
  .billing-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
  .box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
  .box h2{margin:0 0 16px;font-size:16px;color:#0f172a}
  .sec{margin-top:22px}
  #products{display:flex;flex-direction:column;gap:14px}
  .product-card{padding:16px;border:1px solid #e2e8f0;border-radius:14px;background:#f8faff}
  .product-card h3{margin:0 0 12px;font-size:14px;color:#1e40af}
  .product-card .form-grid{grid-template-columns:1.6fr .7fr .8fr}
  .price-input{background:#eef4ff !important;color:#1d4ed8;font-weight:700}
  .remove-btn{margin-top:12px;padding:8px 13px;border:1px solid #fecaca;border-radius:9px;background:#fff5f5;color:#dc2626;font-size:12px;font-weight:700;cursor:pointer}
  .remove-btn:hover{background:#fee2e2}
  .action-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
  .action-buttons .btn{flex:1;min-width:170px;justify-content:center}
  #billScannerBox{margin-top:12px;padding:14px;border:1px solid #dbe4ff;border-radius:14px;background:#f7f9ff}
  #billScannerVideo{width:100%;max-width:400px;min-height:200px;margin:auto;display:block;border-radius:12px;background:#0f172a}
  .quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .quick-card{min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid #e4e9f2;border-radius:13px;background:#f8fafc;color:#1e293b;text-decoration:none;font-size:24px;transition:.2s}
  .quick-card span{font-size:11px;font-weight:700;color:#475569}
  .quick-card:hover{border-color:#bfdbfe;background:#eff6ff;transform:translateY(-2px)}
  @media(max-width:1050px){
    .billing-layout{grid-template-columns:1fr}
    .quick-grid{grid-template-columns:repeat(4,1fr)}
  }
  @media(max-width:700px){
    .product-card .form-grid{grid-template-columns:1fr}
    .quick-grid{grid-template-columns:repeat(2,1fr)}
    .action-buttons{flex-direction:column}
    .action-buttons .btn{width:100%}
  }
</style>
</head>
<body>
{% set active_page = 'billing' %}
{% include '_sidebar.html' %}

<main class="main">
  <header class="topbar">
    <h1>New Bill</h1>
    <a class="btn btn-light" href="/history">📜 Bill History</a>
  </header>

  <section class="content">
  <div class="billing-layout">

    <div class="box">
      <form method="POST" action="/" id="billForm" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <h2>🧾 Customer Information</h2>
        <div class="form-grid">
          <div class="field">
            <label for="customer_name">Customer Name</label>
            <input id="customer_name" type="text" name="customer_name" placeholder="Walk-in Customer" maxlength="100">
          </div>
          <div class="field">
            <label for="mobile">Mobile Number</label>
            <input id="mobile" type="tel" name="mobile" maxlength="10" inputmode="numeric" pattern="[0-9]{10}" placeholder="10 digit mobile number">
          </div>
        </div>

        <div class="form-grid sec">
          <div class="field">
            <label for="payment_method">💳 Payment Method</label>
            <select id="payment_method" name="payment_method">
              <option value="Cash">Cash</option>
              <option value="UPI">UPI</option>
              <option value="Card">Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
          <div class="field">
            <label for="discount_percent">🏷 Discount (%)</label>
            <input type="number" id="discount_percent" name="discount_percent" min="0" max="100" step="0.01" value="0">
          </div>
          <div class="field">
            <label for="tax_percent">📋 Tax / GST (%)</label>
            <input type="number" id="tax_percent" name="tax_percent" min="0" max="100" step="0.01" value="0">
          </div>
        </div>

        <div class="sec">
          <label>📷 Scan Barcode to Add Product</label>
          <button type="button" id="scanBillBtn" class="btn btn-green">📷 Start Scanner</button>
          <div id="billScannerBox" style="display:none;">
            <video id="billScannerVideo"></video>
            <button type="button" id="closeBillScannerBtn" class="btn btn-light" style="margin-top:10px;">❌ Close Scanner</button>
          </div>
        </div>

        <h2 class="sec">📦 Products</h2>
        <div id="products">
          <div class="product-card">
            <h3>🛒 Product Details</h3>
            <div class="form-grid">
              <div class="field">
                <label>📦 Product</label>
                <select name="product[]" class="product-select" required>
                  <option value="">Select Product</option>
                  {% for product in product_list %}
                  <option value="{{ product.name }}" data-id="{{ product.id }}" data-price="{{ product.price_sell }}">{{ product.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="field">
                <label>🔢 Quantity</label>
                <input type="number" name="quantity[]" class="quantity-input" min="1" value="1" required>
              </div>
              <div class="field">
                <label>💰 Price</label>
                <input type="number" name="price[]" class="price-input" step="0.01" min="0" readonly required>
              </div>
            </div>
            <button type="button" class="remove-btn">❌ Remove Product</button>
          </div>
        </div>

        <div class="action-buttons">
          <button type="button" id="addProduct" class="btn btn-green">➕ Add Product</button>
          <button type="submit" id="submitBtn" class="btn">🧾 Generate Bill</button>
        </div>
      </form>
    </div>

    <div class="box">
      <h2>⚡ Quick Menu</h2>
      <div class="quick-grid">
        <a href="/products" class="quick-card">📦<span>Products</span></a>
        <a href="/customers" class="quick-card">👥<span>Customers</span></a>
        <a href="/history" class="quick-card">📜<span>History</span></a>
        <a href="/dashboard" class="quick-card">📊<span>Dashboard</span></a>
      </div>
    </div>

  </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<script>
/* ---------- PRODUCT PRICE ---------- */
function addPriceEvent(selectElement) {
    if (!selectElement) return;
    selectElement.addEventListener("change", async function () {
        const selectedOption = this.options[this.selectedIndex];
        const productId = selectedOption ? selectedOption.getAttribute("data-id") : null;
        const card = this.closest(".product-card");
        const priceInput = card ? card.querySelector('input[name="price[]"]') : null;
        if (!priceInput) return;
        priceInput.value = "";
        if (!productId) return;
        try {
            const response = await fetch("/get_price/" + encodeURIComponent(productId), {
                method: "GET",
                headers: { "X-Requested-With": "XMLHttpRequest" }
            });
            if (!response.ok) throw new Error("Unable to load product price");
            const data = await response.json();
            if (data && data.price !== undefined && data.price !== null) {
                priceInput.value = Number(data.price).toFixed(2);
            }
        } catch (error) {
            console.error("Price loading error:", error);
            priceInput.value = "";
            alert("Unable to load product price. Please try again.");
        }
    });
}

document.querySelectorAll(".product-select").forEach(addPriceEvent);

/* ---------- ADD PRODUCT ---------- */
document.getElementById("addProduct").addEventListener("click", function () {
    const products = document.getElementById("products");
    const row = document.createElement("div");
    row.className = "product-card";
    row.innerHTML = `
        <h3>🛒 Product Details</h3>
        <div class="form-grid">
            <div class="field">
                <label>📦 Product</label>
                <select name="product[]" class="product-select" required>
                    <option value="">Select Product</option>
                    {% for product in product_list %}
                    <option value="{{ product.name }}" data-id="{{ product.id }}" data-price="{{ product.price_sell }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label>🔢 Quantity</label>
                <input type="number" name="quantity[]" class="quantity-input" min="1" value="1" required>
            </div>
            <div class="field">
                <label>💰 Price</label>
                <input type="number" name="price[]" class="price-input" step="0.01" min="0" readonly required>
            </div>
        </div>
        <button type="button" class="remove-btn">❌ Remove Product</button>
    `;
    products.appendChild(row);
    addPriceEvent(row.querySelector(".product-select"));
});

/* ---------- REMOVE PRODUCT ---------- */
document.addEventListener("click", function (event) {
    const removeButton = event.target.closest(".remove-btn");
    if (!removeButton) return;
    const card = removeButton.closest(".product-card");
    const rows = document.querySelectorAll(".product-card");
    if (rows.length <= 1) {
        if (card) {
            const select = card.querySelector(".product-select");
            const quantity = card.querySelector('input[name="quantity[]"]');
            const price = card.querySelector('input[name="price[]"]');
            if (select) select.value = "";
            if (quantity) quantity.value = "1";
            if (price) price.value = "";
        }
        return;
    }
    if (card) card.remove();
});

/* ---------- CUSTOMER AUTO FILL ---------- */
const mobileInput = document.querySelector('input[name="mobile"]');
const customerInput = document.querySelector('input[name="customer_name"]');
let customerLookupTimer = null;

if (mobileInput && customerInput) {
    mobileInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 10);
        const mobile = this.value;
        clearTimeout(customerLookupTimer);
        if (mobile.length !== 10) return;
        customerLookupTimer = setTimeout(async function () {
            try {
                const response = await fetch("/get_customer/" + encodeURIComponent(mobile), {
                    method: "GET",
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                });
                if (!response.ok) return;
                const data = await response.json();
                if (data && data.customer_name) customerInput.value = data.customer_name;
            } catch (error) {
                console.error("Customer lookup error:", error);
            }
        }, 300);
    });
}

/* ---------- FORM VALIDATION ---------- */
document.getElementById("billForm").addEventListener("submit", function (event) {
    const cards = document.querySelectorAll(".product-card");
    if (cards.length === 0) {
        event.preventDefault();
        alert("Please add at least one product.");
        return;
    }
    let valid = true;
    cards.forEach(function (card) {
        const product = card.querySelector(".product-select");
        const quantity = card.querySelector(".quantity-input");
        const price = card.querySelector(".price-input");
        if (!product || !product.value) valid = false;
        if (!quantity || !quantity.value || Number(quantity.value) <= 0) valid = false;
        if (!price || !price.value || Number(price.value) < 0) valid = false;
    });
    if (!valid) {
        event.preventDefault();
        alert("Please select a product and verify quantity and price.");
        return;
    }
    const submitButton = document.getElementById("submitBtn");
    if (submitButton) {
        submitButton.disabled = true;
        submitButton.innerHTML = "⏳ Generating Bill...";
    }
});

/* ---------- ENTER KEY GUARD ---------- */
document.getElementById("billForm").addEventListener("keydown", function (event) {
    if (event.key === "Enter" && event.target.tagName !== "TEXTAREA" && event.target.tagName !== "BUTTON") {
        event.preventDefault();
    }
});

/* ---------- BARCODE SCANNER ---------- */
let billHtml5QrCode = null;

document.getElementById("scanBillBtn").addEventListener("click", function () {
    document.getElementById("billScannerBox").style.display = "block";
    this.style.display = "none";
    billHtml5QrCode = new Html5Qrcode("billScannerVideo");

    Html5Qrcode.getCameras().then(function (devices) {
        if (devices && devices.length) {
            billHtml5QrCode.start(
                devices[0].id,
                { fps: 10, qrbox: 200 },
                async function (decodedText) {
                    try {
                        const response = await fetch(
                            "/get_product_by_barcode/" + encodeURIComponent(decodedText),
                            { method: "GET", headers: { "X-Requested-With": "XMLHttpRequest" } }
                        );
                        const data = await response.json();
                        if (data && data.found) {
                            const cards = document.querySelectorAll(".product-card");
                            let targetCard = null;
                            cards.forEach(function (card) {
                                const s = card.querySelector(".product-select");
                                if (!targetCard && s && !s.value) targetCard = card;
                            });
                            if (!targetCard) targetCard = cards[cards.length - 1];
                            targetCard.querySelector(".product-select").value = data.name;
                            targetCard.querySelector('input[name="price[]"]').value = Number(data.price).toFixed(2);
                        } else {
                            alert("❌ No product found with this barcode.");
                        }
                    } catch (error) {
                        alert("Error looking up barcode: " + error);
                    }
                    billHtml5QrCode.stop().then(function () {
                        document.getElementById("billScannerBox").style.display = "none";
                        document.getElementById("scanBillBtn").style.display = "inline-flex";
                    });
                },
                function () {}
            );
        }
    }).catch(function (err) {
        alert("Camera access error: " + err);
        document.getElementById("billScannerBox").style.display = "none";
        document.getElementById("scanBillBtn").style.display = "inline-flex";
    });
});

document.getElementById("closeBillScannerBtn").addEventListener("click", function () {
    if (billHtml5QrCode) {
        billHtml5QrCode.stop().then(function () {
            document.getElementById("billScannerBox").style.display = "none";
            document.getElementById("scanBillBtn").style.display = "inline-flex";
        });
    }
});

/* ---------- SERVICE WORKER ---------- */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js");
    });
}
</script>
</body>
</html>
