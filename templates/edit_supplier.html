<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Supplier</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
{% set active_page = 'suppliers' %}
{% include '_sidebar.html' %}

<main class="main">
  <header class="topbar">
    <h1>Edit Supplier</h1>
    <a class="btn btn-light" href="/suppliers">← Back</a>
  </header>

  <section class="content">
    <div class="card" style="padding:22px;max-width:720px">
      <form method="POST" action="/edit_supplier/{{ supplier.id }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-grid">
          <div class="field">
            <label>Supplier Name</label>
            <input type="text" name="name" required value="{{ supplier.name }}">
          </div>
          <div class="field">
            <label>Contact Person</label>
            <input type="text" name="contact_person" value="{{ supplier.contact_person or '' }}">
          </div>
          <div class="field">
            <label>Mobile Number</label>
            <input type="text" name="mobile" value="{{ supplier.mobile or '' }}">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" value="{{ supplier.email or '' }}">
          </div>
          <div class="field" style="grid-column:1/-1">
            <label>Address</label>
            <input type="text" name="address" value="{{ supplier.address or '' }}">
          </div>
        </div>
        <button class="btn" type="submit" style="margin-top:18px">💾 Update Supplier</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
