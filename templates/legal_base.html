<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{% endblock %} | {{ c.product }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#030b1d;--surface:rgba(8,23,52,.88);--text:#f8fbff;--text-2:#c7d5ed;--muted:#7f94b8;--line:rgba(117,157,219,.18);--blue:#1683ff;--cyan:#12d9ff}
body{font-family:Inter,sans-serif;background:radial-gradient(circle at 20% 0%,#0a1f4d,var(--bg) 60%);color:var(--text);min-height:100vh;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:10px}
.brand a.logo{color:#fff;text-decoration:none;font-weight:800;font-size:20px}
.brand a.back{color:var(--text-2);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:7px 14px;border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px}
h1{font-size:28px;font-weight:800;margin-bottom:4px}
.upd{color:var(--muted);font-size:13px;margin-bottom:22px}
h2{font-size:17px;margin:24px 0 8px;color:var(--cyan)}
p,li{color:var(--text-2);font-size:14.5px}
ul{padding-left:20px;margin:6px 0}
a{color:var(--cyan)}
.foot{margin-top:22px;text-align:center;font-size:13px;color:var(--muted)}
.foot a{color:var(--text-2);text-decoration:none;margin:0 8px}
.foot a:hover{color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a class="logo" href="/">{{ c.product }}</a>
    <a class="back" href="/login">Login</a>
  </div>
  <div class="card">
    {% block body %}{% endblock %}
  </div>
  <div class="foot">
    <a href="/terms">Terms &amp; Conditions</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="/refund-policy">Refund Policy</a>
    <a href="/contact">Contact Us</a>
    <div style="margin-top:10px">&copy; {{ c.name }}. All rights reserved.</div>
  </div>
</div>
</body>
</html>
