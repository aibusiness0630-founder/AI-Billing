<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            flex-wrap:wrap;
            gap:10px;
        }

        .btn{
            background:#007bff;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:5px;
        }

        .table-box{
            overflow-x:auto;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px #ccc;
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f5f5f5;
        }

    </style>

</head>

<body>

<h1>👥 Customers</h1>

<div class="top">

    <a href="/" class="btn">
        🏠 Home
    </a>

    <b>Total Customers : {{ customers|length }}</b>

</div>

<div class="table-box">

<table>

<tr>
    <th>S.No</th>
    <th>Customer Name</th>
    <th>Mobile Number</th>
    <th>Action</th>
</tr>

{% for customer in customers %}

<tr>

    <td>{{ loop.index }}</td>

    <td>{{ customer.customer_name }}</td>

    <td>{{ customer.mobile }}</td>

    <td>

        <a class="btn"
           href="/customer/{{ customer.mobile }}">

            👤 View Profile

        </a>

    </td>

</tr>

{% else %}

<tr>

<td colspan="4">

No Customers Found

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
