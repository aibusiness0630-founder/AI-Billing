<!DOCTYPE html>
<html>
<head>
    <title>Add Customer</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
            padding:20px;
            display:flex;
            justify-content:center;
        }

        .form-box{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px #ccc;
            width:100%;
            max-width:450px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:15px;
        }

        button:hover{
            background:#0056b3;
        }

        .back-link{
            display:block;
            text-align:center;
            margin-top:15px;
            color:#007bff;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h1>➕ Add Customer</h1>

    <form method="POST" action="/add_customer">

        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label>Customer Name</label>
        <input type="text" name="name" required placeholder="Enter customer name">

        <label>Mobile Number</label>
        <input type="text" name="mobile" required placeholder="Enter mobile number" maxlength="10">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email (optional)">

        <label>Address</label>
        <input type="text" name="address" placeholder="Enter address (optional)">

        <button type="submit">💾 Save Customer</button>

    </form>

    <a href="/customers" class="back-link">⬅ Back to Customers</a>

</div>

</body>
</html>
