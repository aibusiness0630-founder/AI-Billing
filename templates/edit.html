<!DOCTYPE html>
<html>
<head>
    <title>Edit Bill</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<h1>✏️ Edit Bill</h1>

<form method="POST" id="editForm">

    <label>Customer Name:</label><br>
    <input
        type="text"
        name="customer_name"
        value="{{ bill.customer_name }}"
        placeholder="Customer Name"
        required>
    <br><br>

    <label>Mobile:</label><br>
    <input
        type="text"
        name="mobile"
        value="{{ bill.mobile }}"
        maxlength="10"
        pattern="[0-9]{10}"
        placeholder="10 Digit Mobile Number"
        required>
    <br><br>

    <label>Product:</label><br>
    <input
        type="text"
        name="product"
        value="{{ bill.product }}"
        required>
    <br><br>

    <label>Quantity:</label><br>
    <input
        type="number"
        name="quantity"
        value="{{ bill.quantity }}"
        min="1"
        required>
    <br><br>

    <label>Price:</label><br>
    <input
        type="number"
        name="price"
        value="{{ bill.price }}"
        step="0.01"
        min="0.01"
        required>
    <br><br>

    <button type="submit" id="updateBtn">
        💾 Update Bill
    </button>

</form>

<br>

<a href="/history">
    <button type="button">
        ⬅ Back
    </button>
</a>

</div>

<script>
document.getElementById("editForm").addEventListener("submit", function () {
    const btn = document.getElementById("updateBtn");
    btn.disabled = true;
    btn.innerHTML = "Updating...";
});
</script>

</body>
</html>
