<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px #ccc;
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f2f2f2;
        }

        .btn{
            background:#007bff;
            color:white;
            padding:8px 15px;
            text-decoration:none;
            border-radius:5px;
        }

        .top{
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<h1>👥 Customers</h1>

<div class="top">
    <a href="/" class="btn">🏠 Home</a>
</div>

<table>

<tr>
    <th>S.No</th>
    <th>Customer Name</th>
    <th>Mobile Number</th>
    <th>Action</th>
</tr>

{% for customer in customers %}

<tr>

    <td>{{ loop.index }}</td>

    <td>{{ customer.customer_name }}</td>

    <td>{{ customer.mobile }}</td>

    <td>
        <a class="btn" href="/customer/{{ customer.mobile }}">
            View Profile
        </a>
    </td>

</tr>

{% endfor %}

</table>

</body>
</html>
