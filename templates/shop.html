<!DOCTYPE html>
<html>
<head>
    <title>Shop Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>⚙️ Shop Settings</h1>

<form method="POST" id="shopForm">

<label>Shop Name</label><br>
<input
    type="text"
    name="shop_name"
    value="{{ shop.shop_name if shop else '' }}"
    placeholder="Enter Shop Name"
    required>
<br><br>

<label>Address</label><br>
<input
    type="text"
    name="address"
    value="{{ shop.address if shop else '' }}"
    placeholder="Enter Address">
<br><br>

<label>Phone</label><br>
<input
    type="text"
    name="phone"
    value="{{ shop.phone if shop else '' }}"
    maxlength="10"
    pattern="[0-9]{10}"
    placeholder="10 Digit Phone Number">
<br><br>

<label>Shop Type</label><br>
<input
    type="text"
    name="shop_type"
    value="{{ shop.shop_type if shop else '' }}"
    placeholder="Example: Grocery">
<br><br>

<label>Username</label><br>
<input
    type="text"
    name="username"
    value="{{ shop.username if shop else '' }}"
    placeholder="Create Username"
    required>
<br><br>

<label>Password</label><br>
<input
    type="password"
    name="password"
    placeholder="Leave empty to keep current password">
<br><br>

<button type="submit" id="saveBtn">
    💾 Save Settings
</button>

</form>

<br>

<a href="/">
    <button type="button">🏠 Back to Home</button>
</a>

</div>

<script>
document.getElementById("shopForm").addEventListener("submit", function () {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.innerHTML = "Saving...";
});
</script>

</body>
</html>
