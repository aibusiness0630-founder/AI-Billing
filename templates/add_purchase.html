<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Purchase</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  .product-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:12px;padding:14px;background:#f8faff;border:1px solid #e2e8f0;border-radius:12px}
  .pay-box{background:#eff6ff;border:1px solid #dbeafe;border-radius:12px;padding:16px}
  h3.sec{margin:22px 0 12px;font-size:15px;color:#0f172a}
  @media(max-width:700px){.product-row{grid-template-columns:1fr}}
</style>
</head>
<body>
{% set active_page = 'purchases' %}
{% include '_sidebar.html' %}

<main class="main">
  <header class="topbar">
    <h1>New Purchase Order</h1>
    <a class="btn btn-light" href="/purchases">← Back</a>
  </header>

  <section class="content">
    <div class="card" style="padding:22px;max-width:900px">
      <form method="POST" action="/add_purchase">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="field">
          <label>Supplier</label>
          <select name="supplier_id" required>
            <option value="">Select Supplier</option>
            {% for supplier in suppliers %}
            <option value="{{ supplier.id }}">{{ supplier.name }}</option>
            {% endfor %}
          </select>
        </div>

        <h3 class="sec">📦 Products</h3>
        <div id="productRows">
          <div class="product-row">
            <div class="field">
              <label>Product</label>
              <select name="product_id[]" required>
                <option value="">Select Product</option>
                {% for product in products %}
                <option value="{{ product.id }}">{{ product.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="field">
              <label>Quantity</label>
              <input type="number" name="quantity[]" min="1" required>
            </div>
            <div class="field">
              <label>Cost Price</label>
              <input type="number" name="cost_price[]" step="0.01" min="0" required>
            </div>
            <button type="button" class="btn btn-del" onclick="removeRow(this)">❌</button>
          </div>
        </div>

        <button type="button" class="btn btn-green" onclick="addRow()">➕ Add Product Row</button>

        <h3 class="sec">💰 Payment Details</h3>
        <div class="pay-box">
          <div class="form-grid">
            <div class="field">
              <label>Payment Method</label>
              <select name="payment_method">
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="UPI">UPI</option>
                <option value="Cheque">Cheque</option>
                <option value="Credit">Credit (Pay Later)</option>
              </select>
            </div>
            <div class="field">
              <label>Amount Paid Now (₹)</label>
              <input type="number" name="amount_paid" step="0.01" min="0" value="0" placeholder="0 if paying later">
            </div>
          </div>
          <small class="muted" style="display:block;margin-top:10px">Pay later na amount 0-vaa vidunga. Partial payment-um allowed.</small>
        </div>

        <button type="submit" class="btn" style="margin-top:20px">💾 Save Purchase Order</button>
      </form>
    </div>
  </section>
</main>

<script>
function removeRow(btn) {
    var rows = document.querySelectorAll(".product-row");
    if (rows.length > 1) btn.closest(".product-row").remove();
}

function addRow() {
    const row = document.createElement("div");
    row.className = "product-row";
    row.innerHTML = `
        <div class="field">
            <label>Product</label>
            <select name="product_id[]" required>
                <option value="">Select Product</option>
                {% for product in products %}
                <option value="{{ product.id }}">{{ product.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label>Quantity</label>
            <input type="number" name="quantity[]" min="1" required>
        </div>
        <div class="field">
            <label>Cost Price</label>
            <input type="number" name="cost_price[]" step="0.01" min="0" required>
        </div>
        <button type="button" class="btn btn-del" onclick="removeRow(this)">❌</button>
    `;
    document.getElementById("productRows").appendChild(row);
}
</script>
</body>
</html>
