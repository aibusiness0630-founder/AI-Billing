<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
  .barcode-row{display:flex;gap:10px}
  .barcode-row input{flex:1}
  #scannerBox{margin-top:14px;padding:16px;background:#0f172a;border-radius:14px}
  #scannerVideo{display:block;width:100%;max-width:400px;min-height:200px;margin:auto;border-radius:12px;background:#020617}
  .scanner-title{text-align:center;color:#e2e8f0;font-size:13px;font-weight:700;margin-bottom:10px}
  @media(max-width:600px){.barcode-row{flex-direction:column}}
</style>
</head>
<body>
{% set active_page = 'products' %}
{% include '_sidebar.html' %}

<main class="main">
  <header class="topbar">
    <h1>Add Product</h1>
    <a class="btn btn-light" href="/products">← View Products</a>
  </header>

  <section class="content">
    <div class="card" style="padding:22px;max-width:720px">
      <form method="POST" id="productForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-grid">
          <div class="field" style="grid-column:1/-1">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" name="product_name" placeholder="Enter product name" required>
          </div>

          <div class="field">
            <label for="price">Price (₹)</label>
            <input type="number" id="price" name="price" step="0.01" min="0.01" placeholder="Selling price" required>
          </div>

          <div class="field">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" min="0" placeholder="Opening stock" required>
          </div>

          <div class="field" style="grid-column:1/-1">
            <label for="barcodeInput">Barcode <span class="muted">(Optional)</span></label>
            <div class="barcode-row">
              <input type="text" name="barcode" id="barcodeInput" placeholder="Scan or type barcode">
              <button type="button" id="scanBtn" class="btn btn-light">📷 Scan</button>
            </div>

            <div id="scannerBox" style="display:none;">
              <div class="scanner-title">📷 Position the barcode inside the scanner</div>
              <video id="scannerVideo"></video>
              <button type="button" id="closeScannerBtn" class="btn btn-light" style="display:flex;margin:12px auto 0">❌ Close Scanner</button>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn" style="margin-top:18px">➕ Add Product</button>
      </form>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
document.getElementById("productForm").addEventListener("submit", function () {
    var b = document.getElementById("submitBtn");
    b.disabled = true;
    b.innerHTML = "⏳ Saving...";
});

let html5QrCode = null;

document.getElementById("scanBtn").addEventListener("click", function () {
    document.getElementById("scannerBox").style.display = "block";
    this.style.display = "none";
    html5QrCode = new Html5Qrcode("scannerVideo");

    Html5Qrcode.getCameras().then(function (devices) {
        if (devices && devices.length) {
            html5QrCode.start(
                devices[0].id,
                { fps: 10, qrbox: 200 },
                function (decodedText) {
                    document.getElementById("barcodeInput").value = decodedText;
                    html5QrCode.stop().then(function () {
                        document.getElementById("scannerBox").style.display = "none";
                        document.getElementById("scanBtn").style.display = "inline-flex";
                    });
                },
                function () {}
            );
        }
    }).catch(function (err) {
        alert("Camera access error: " + err);
        document.getElementById("scannerBox").style.display = "none";
        document.getElementById("scanBtn").style.display = "inline-flex";
    });
});

document.getElementById("closeScannerBtn").addEventListener("click", function () {
    if (html5QrCode) {
        html5QrCode.stop().then(function () {
            document.getElementById("scannerBox").style.display = "none";
            document.getElementById("scanBtn").style.display = "inline-flex";
        });
    }
});
</script>
</body>
</html>
